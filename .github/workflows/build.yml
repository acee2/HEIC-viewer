name: Build HEIC Viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installa .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compila l'app (self-contained, non serve installare .NET)
        shell: pwsh
        run: |
          dotnet publish src/HeicViewer/HeicViewer.csproj -c Release -r win-x64 --self-contained true -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem publish | Select-Object Name, Length | Format-Table -AutoSize

      - name: Crea l'installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\HeicViewer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Carica il Setup
        uses: actions/upload-artifact@v4
        with:
          name: HEIC-Viewer-Setup
          path: dist/HEIC-Viewer-Setup.exe

      - name: Pubblica la release "latest" (link di download fisso)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest dist/HEIC-Viewer-Setup.exe --target "${{ github.sha }}" --title "HEIC Viewer (ultima versione)" --notes "Setup dell'ultima build. Scarica HEIC-Viewer-Setup.exe e avvialo." --latest
